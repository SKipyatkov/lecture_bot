services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lecture
      POSTGRES_PASSWORD: lecture
      POSTGRES_DB: lecture_bot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecture -d lecture_bot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  lecture-bot:
    build: .
    image: lecture-bot:local
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://lecture:lecture@postgres:5432/lecture_bot
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
